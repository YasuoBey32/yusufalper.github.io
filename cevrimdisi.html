<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çevrimdışı | Yusuf Alper</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f6fb">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'YA Display';font-weight:300 800;font-display:swap;src:url('/assets/fonts/unbounded-latin-ext-300-800.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'YA Display';font-weight:300 800;font-display:swap;src:url('/assets/fonts/unbounded-latin-300-800.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'YA Sans';font-weight:300 800;font-display:swap;src:url('/assets/fonts/manrope-latin-ext-300-800.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'YA Sans';font-weight:300 800;font-display:swap;src:url('/assets/fonts/manrope-latin-300-800.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;padding:24px;font-family:'YA Sans',system-ui,sans-serif;color:#0a0c12;background:#f3f5fa;overflow:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;opacity:.6}
.bg i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-25vmax;background:radial-gradient(circle,rgba(31,168,255,.3),transparent 62%);animation:a 18s ease-in-out infinite alternate}
.bg i:nth-child(2){width:60vmax;height:60vmax;right:-20vmax;bottom:-25vmax;background:radial-gradient(circle,rgba(227,10,23,.2),transparent 62%);animation:b 22s ease-in-out infinite alternate}
@keyframes a{to{transform:translate(15vw,10vh) scale(1.1)}}
@keyframes b{to{transform:translate(-12vw,-12vh) scale(1.15)}}
.card{position:relative;width:min(520px,100%);padding:44px 36px 38px;text-align:center;border-radius:34px;background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,255,255,.48));-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 0 #fff inset,0 30px 80px -30px rgba(30,40,80,.35);animation:in 1s cubic-bezier(.22,1,.36,1) both}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.96);filter:blur(10px)}}
.sig{position:relative;width:120px;height:120px;margin:0 auto 26px}
.sig span{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(227,10,23,.5);animation:ring 2.6s cubic-bezier(.22,1,.36,1) infinite;opacity:0}
.sig span:nth-child(2){animation-delay:.85s}.sig span:nth-child(3){animation-delay:1.7s}
@keyframes ring{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.sig svg{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;color:#0a0c12}
.code{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6b7285;margin:0 0 12px}
h1{font-family:'YA Display',system-ui,sans-serif;font-weight:700;font-size:clamp(28px,6vw,40px);letter-spacing:-.035em;line-height:1.05;margin:0 0 14px}
p{color:#3a4050;line-height:1.6;margin:0 0 28px}
button{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 26px;border:0;border-radius:999px;background:#0a0c12;color:#fff;font:700 15.5px 'YA Sans',system-ui,sans-serif;cursor:pointer;box-shadow:0 14px 34px -12px rgba(10,12,18,.55);transition:transform .3s}
button:active{transform:scale(.96)}
button svg{width:18px;height:18px}
.st{margin-top:18px;font-size:13px;color:#6b7285}
.st b{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e30a17;margin-right:8px;vertical-align:middle}
.on .st b{background:#19c37d}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i></div>
<main class="card">
  <div class="sig" aria-hidden="true"><span></span><span></span><span></span>
    <svg viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 6-3.2M22 8.5A15 15 0 0 0 12.6 4.5M5 12a10 10 0 0 1 4-2.3M19 12a10 10 0 0 0-2.6-1.8M8.5 15.5a5 5 0 0 1 7 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="19" r="1.3" fill="currentColor"/><path d="m3 3 18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </div>
  <p class="code">Bağlantı Yok</p>
  <h1>Şu an çevrimdışısınız</h1>
  <p>İnternet bağlantınız kesildi. Bağlantı geri geldiğinde sayfa kendiliğinden yenilenecek.</p>
  <button type="button" id="retry"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Yeniden dene</button>
  <div class="st" id="st"><b></b><span>Bağlantı bekleniyor</span></div>
</main>
<script>
(function(){var b=document.getElementById('retry'),s=document.getElementById('st');function go(){location.reload()}b.addEventListener('click',go);window.addEventListener('online',function(){document.body.classList.add('on');s.lastChild.textContent='Bağlantı geri geldi';setTimeout(go,700)});})();
</script>
</body>
</html>
